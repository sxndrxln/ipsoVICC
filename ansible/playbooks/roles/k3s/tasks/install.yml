---
- name: Check installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false

- name: Install k3s
  when: k3s_installed_version.rc != 0 or k3s_version not in k3s_installed_version.stdout
  block:
    - name: Download k3s install script
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"

    - name: Run k3s install script
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      changed_when: true

- name: Apply pending k3s restart
  ansible.builtin.meta: flush_handlers

- name: Ensure k3s is running
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Wait for node to become ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
